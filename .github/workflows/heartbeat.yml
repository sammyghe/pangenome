name: heartbeat

# The metabolism.
#
# The organism has no server and no daemon. It wakes here, senses the public
# registries, decides, appends to its genome, commits, and dies. Between
# heartbeats it costs exactly zero because it does not exist.
#
# Daily, because the epidemiology needs distinct *days* to fit a rate — several
# runs inside one day are one observation, not several, and the estimator
# collapses them accordingly.

on:
  schedule:
    - cron: "17 5 * * *"     # 05:17 UTC daily — off the hour, cron queues are busy on it
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heartbeat
  cancel-in-progress: false   # never interrupt a beat mid-write

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # no pip install step: zero dependencies, by design

      - name: Verify the membrane before letting it near the network
        run: python -m unittest tests.test_organism.TestMembrane -v

      - name: Confirm the organism exists
        run: |
          test -f genome/chromosome.json || {
            echo "No chromosome. Germinate locally and commit genome/chromosome.json."
            echo "It is not germinated here on purpose: a key created on a runner"
            echo "is a key nobody holds."
            exit 1
          }

      - name: Beat
        env:
          # Raises the GitHub search rate limit. Read-only regardless: the
          # membrane refuses every method but GET, so this token cannot write.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deliberately NOT set. Without a signing key this runner senses,
          # measures and records, but cannot mint into the genome — so
          # compromising the always-online instance cannot widen what the
          # organism trusts. Acquisition happens on a host holding root.key.
          # PANGENOME_ROOT_KEY: ${{ secrets.PANGENOME_ROOT_KEY }}
        run: python -m pangenome beat

      - name: Commit the genome
        run: |
          git config user.name  "pangenome"
          git config user.email "pangenome@users.noreply.github.com"
          git add genome/
          if git diff --staged --quiet; then
            echo "no change this beat"
          else
            git commit -m "heartbeat: $(date -u +%Y-%m-%d)"
            git push
          fi

# heartbeat registered
